name: Deploy via Bastion

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "Host bastion" >> ~/.ssh/config
          echo "  HostName ${{ secrets.BASTION_HOST }}" >> ~/.ssh/config
          echo "  User ${{ secrets.BASTION_USER }}" >> ~/.ssh/config
          echo "  Port ${{ secrets.BASTION_PORT }}" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/id_ed25519" >> ~/.ssh/config

          echo "Host target" >> ~/.ssh/config
          echo "  HostName ${{ secrets.TARGET_HOST }}" >> ~/.ssh/config
          echo "  User ${{ secrets.TARGET_USER }}" >> ~/.ssh/config
          echo "  ProxyJump bastion" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/id_ed25519" >> ~/.ssh/config

          ssh-keyscan -p ${{ secrets.BASTION_PORT }} ${{ secrets.BASTION_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh target << 'EOF'
            cd /root/web/src/nexuscore.goodloss.fr
            git pull origin main

            echo "📦 Backend..."
            cd backend
            npm install --production

            echo "🎨 Frontend..."
            cd ../frontend
            npm install
            npm run build

            echo "🔄 Restart..."
            pm2 reload all || pm2 start ecosystem.config.js

            echo "✅ Done"
          EOF