# Vhost complet Nexus Core Arena — à copier vers /etc/nginx/sites-enabled/nexuscore.goodloss.conf
# puis : sudo nginx -t && sudo systemctl reload nginx
#
# HTTP/2 volontairement DÉSACTIVÉ sur le listen 443 (pas de "http2" après ssl) pour limiter
# les erreurs Chrome ERR_HTTP2_PROTOCOL_ERROR sur les gros JS. Voir deploy/TROUBLESHOOTING_HTTP2_QUIC.md
# Pour réactiver HTTP/2 plus tard : listen 443 ssl http2;

server {
    listen 80;
    listen [::]:80;
    server_name nexuscore.goodloss.fr;
    return 301 https://$host$request_uri;
}

server {
    # Pas de "http2" ici (diagnostic erreurs assets / HTTP2)
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nexuscore.goodloss.fr;

    ssl_certificate     /etc/letsencrypt/live/nexuscore.goodloss.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexuscore.goodloss.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /root/web/src/nexuscore.goodloss.fr/frontend/dist;
    index index.html index.php;

    location /api/ {
        proxy_pass http://127.0.0.1:3205/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        default_type application/json;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_fallback;
    }
    location @api_fallback {
        default_type application/json;
        return 503 '{"error":"BACKEND_UNREACHABLE","message":"Service temporairement indisponible. Réessayez dans un instant."}';
    }

    location /personnages/ {
        alias /root/web/src/nexuscore.goodloss.fr/personnages/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_index index.php;
    }

    access_log /mnt/hdd/web/logs/nexuscore_access.log;
    error_log /mnt/hdd/web/logs/nexuscore_error.log;
}
